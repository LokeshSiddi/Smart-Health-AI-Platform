spring:
  cloud:
    gateway:
      httpclient:
        connect-timeout: 2000
        response-timeout: 3s
        pool:
          type: elastic
          max-connections: 500 # Default is often too low for a 500 VU spike
          acquire-timeout: 5000
      server:
        webflux:
          routes:
            - id: user-service
              uri: lb://USER-SERVICE
              predicates:
                - Path=/api/users/**

            - id: activity-service
              uri: lb://ACTIVITY-SERVICE
              predicates:
                - Path=/api/activities/**

            - id: ai-service
              uri: lb://AI-SERVICE
              predicates:
                - Path=/api/recommendations/**

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:8181/realms/fitness-oauth2/protocol/openid-connect/certs

server:
  port: 8080
  tomcat:
    threads:
      max: 500 # If using Tomcat (MVC)
    netty:
      # If using WebFlux/Netty (Standard for Gateway)
      connection-timeout: 2000
      idle-timeout: 10s

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    registry-fetch-interval-seconds: 30 # Don't fetch every second
    disable-delta: true
  instance:
    lease-renewal-interval-in-seconds: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
