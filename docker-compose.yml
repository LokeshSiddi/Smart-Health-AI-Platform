version: '3.8'

services:
  # ==========================================
  # 1. INFRASTRUCTURE LAYER
  # ==========================================
  postgres:
    image: postgres:15-alpine
    container_name: postgres-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: fitness_user_db # Creates the only DB we need automatically
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fitness-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d fitness_user_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7.0
    container_name: mongo-db
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - fitness-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq-broker
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - fitness-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: keycloak-auth
    # Runs in dev mode (uses internal H2 DB) and imports your realm config
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8181:8080"
    volumes:
      # Put your realm-export.json in a folder named 'keycloak-setup' in your root directory
      - ./keycloak-setup:/opt/keycloak/data/import
    networks:
      - fitness-network

  # ==========================================
  # 2. DISCOVERY & CONFIG LAYER
  # ==========================================
  eureka:
    build: ./eureka
    container_name: eureka
    ports:
      - "8761:8761"
    networks:
      - fitness-network

  configserver:
    build: ./configserver
    container_name: configserver
    ports:
      - "8888:8888"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka:8761/eureka/
    networks:
      - fitness-network
    depends_on:
      - eureka

  # ==========================================
  # 3. MICROSERVICES LAYER
  # ==========================================
  userservice:
    build: ./userservice
    container_name: userservice
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/fitness_user_db
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka:8761/eureka/
      - SPRING_CONFIG_IMPORT=optional:configserver:http://configserver:8888
    networks:
      - fitness-network
    depends_on:
      postgres:
        condition: service_healthy
      eureka:
        condition: service_started
      configserver:
        condition: service_started

  activityservice:
    build: ./activityservice
    container_name: activityservice
    ports:
      - "8082:8082"
    environment:
      # Connects to standard Mongo DB (Collections created lazily)
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/fitness_activity
      - SPRING_RABBITMQ_HOST=rabbitmq
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka:8761/eureka/
      - SPRING_CONFIG_IMPORT=optional:configserver:http://configserver:8888
    networks:
      - fitness-network
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eureka:
        condition: service_started
      configserver:
        condition: service_started

  aiservice:
    build: ./aiservice
    container_name: aiservice
    ports:
      - "8083:8083"
    environment:
      # Connects to standard Mongo DB (Collections created lazily)
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/fitness_recommendation
      - SPRING_RABBITMQ_HOST=rabbitmq
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka:8761/eureka/
      - SPRING_CONFIG_IMPORT=optional:configserver:http://configserver:8888
      - GEMINI_API_URL=${GEMINI_API_URL}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    networks:
      - fitness-network
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eureka:
        condition: service_started
      configserver:
        condition: service_started

  # ==========================================
  # 4. GATEWAY & FRONTEND LAYER
  # ==========================================
  gateway:
    build: ./gateway
    container_name: gateway
    ports:
      - "8080:8080"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka:8761/eureka/
      - SPRING_CONFIG_IMPORT=optional:configserver:http://configserver:8888
      # Gateway talks to Keycloak internally to fetch the JWK certs for decoding tokens
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI=http://keycloak:8080/realms/fitness-oauth2/protocol/openid-connect/certs
    networks:
      - fitness-network
    depends_on:
      - eureka
      - configserver
      - keycloak

  frontend:
    build: ./fitness-app-frontend
    container_name: fitness-frontend
    ports:
      - "5173:80"
    networks:
      - fitness-network
    depends_on:
      - gateway

networks:
  fitness-network:
    driver: bridge

volumes:
  postgres_data:
  mongo_data: