version: '3.8'

services:

  # ------------------------
  # MongoDB
  # ------------------------
  mongodb:
    image: mongo:6-alpine
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  # ------------------------
  # PostgreSQL
  # ------------------------
  postgres:
    image: postgres:alpine
    container_name: postgres
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # ------------------------
  # Keycloak (Auth)
  # ------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: keycloak
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    depends_on:
      - postgres
    ports:
      - "8084:8080"

  # ------------------------
  # RabbitMQ (Message Broker)
  # ------------------------
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"  # dashboard

  # ------------------------
  # Eureka Server
  # ------------------------
  eureka:
    build: ./eureka-server
    ports:
      - "8761:8761"

  # ------------------------
  # Config Server
  # ------------------------
  config-server:
    build: ./config-server
    ports:
      - "8888:8888"
    depends_on:
      - eureka

  # ------------------------
  # User Service
  # ------------------------
  user-service:
    build: ./user-service
    ports:
      - "8081:8081"
    depends_on:
      - eureka
      - config-server
      - keycloak
      - mongodb

  # ------------------------
  # Activity Service
  # ------------------------
  activity-service:
    build: ./activity-service
    ports:
      - "8082:8082"
    depends_on:
      - eureka
      - config-server
      - mongodb

  # ------------------------
  # AI Service (JAVA)
  # ------------------------
  ai-service:
    build: ./ai-service
    ports:
      - "8083:8083"
    depends_on:
      - eureka
      - config-server
    environment:
      - GEMINI_API_URL
      - GEMINI_API_KEY

  # ------------------------
  # API Gateway
  # ------------------------
  api-gateway:
    build: ./api-gateway
    ports:
      - "8080:8080"
    depends_on:
      - eureka
      - keycloak
      - user-service
      - activity-service
      - ai-service

volumes:
  mongo_data: